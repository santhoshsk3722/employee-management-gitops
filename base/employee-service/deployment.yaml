apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service
  namespace: employee-mgmt
  labels:
    app: employee-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      containers:
        - name: employee-service
          image: <ECR_REGISTRY>/employee-mgmt/employee-service:<IMAGE_TAG>
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: employee-service-config
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15
