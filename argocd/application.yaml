apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: employee-mgmt-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: employee-mgmt
  source:
    repoURL: "https://github.com/santhoshsk3722/employee-management-gitops.git"
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: employee-mgmt
  syncPolicy:
    automated:
      prune: true      # remove resources deleted from git
      selfHeal: true    # revert manual cluster drift back to git state
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
